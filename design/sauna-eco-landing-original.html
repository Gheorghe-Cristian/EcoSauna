  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

999px; font-weight: 700; min-height: 52px; display: inline-flex; align-items: center; gap: 10px\">Rezervă o ședință\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<a class=\"btn-ghost\" href=\"#pachete\" style=\"border: 1px solid rgba(239,230,216,.28); padding: 16px 30px; border-radius: 999px; font-weight: 600; min-height: 52px; display: inline-flex; align-items: center\">Vezi pachetele<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding-top: 20px; border-top: 1px solid rgba(239,230,216,.12); max-width: 520px\">\n<div><div style=\"font-family: 'Fraunces', serif; font-size: 28px\">08–23<\u002Fdiv><div style=\"font-size: 13px; color: #B5A893\">Deschis zilnic<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-family: 'Fraunces', serif; font-size: 28px\">100%<\u002Fdiv><div style=\"font-size: 13px; color: #B5A893\">Sobă pe lemne<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-family: 'Fraunces', serif; font-size: 28px\">P<\u002Fdiv><div style=\"font-size: 13px; color: #B5A893\">Parcare păzită<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position: relative\">\n<div style=\"aspect-ratio: 4 / 5; border-radius: 28px; overflow: hidden; background: #2A211A; background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 64px), repeating-linear-gradient(0deg, rgba(255,190,130,.05) 0 1px, transparent 1px 9px); display: flex; align-items: center; justify-content: center; position: relative\">\n<div style=\"text-align: center; color: rgba(239,230,216,.55); font-size: 14px; letter-spacing: .08em; display: flex; flex-direction: column; align-items: center; gap: 14px\">\n<svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 3c0 2-2 2-2 4s2 2 2 4M12 3c0 2-2 2-2 4s2 2 2 4M16 3c0 2-2 2-2 4s2 2 2 4\"><\u002Fpath><path d=\"M3 15h18v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"><\u002Fpath><\u002Fsvg>\n[FOTO: interiorul băii de aburi — lemn, sobă, abur]\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position: absolute; left: clamp(-12px, -2vw, -32px); bottom: 32px; background: #EFE6D8; color: #1B1712; padding: 20px 24px; border-radius: 20px; display: flex; gap: 16px; align-items: center; max-width: 300px; box-shadow: 0 24px 60px rgba(0,0,0,.45)\">\n<div style=\"width: 48px; height: 48px; flex: none; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center\">\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1A120C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22c4 0 7-3 7-7 0-5-4-7-5-12-2 2-3 4-3 6-1-1-2-2-2-4-2 2-4 5-4 10 0 4 3 7 7 7z\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div><div style=\"font-weight: 700; font-size: 15px\">Banșcik profesionist<\u002Fdiv><div style=\"font-size: 13px; color: #5A5045\">Ritual cu venik din mesteacăn de calitate<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- STRIP -->\n<div style=\"border-top: 1px solid rgba(239,230,216,.1); border-bottom: 1px solid rgba(239,230,216,.1); background: #17140F\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 22px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px 32px; font-family: 'Fraunces', serif; font-style: italic; font-size: clamp(17px, 1.6vw, 21px); color: #CFC4B2\">\n<span>Baie rusească<\u002Fspan><span style=\"color: {{accent}}\">✦<\u002Fspan>\n<span>Saună finlandeză<\u002Fspan><span style=\"color: {{accent}}\">✦<\u002Fspan>\n<span>Apă rece<\u002Fspan><span style=\"color: {{accent}}\">✦<\u002Fspan>\n<span>Terasă &amp; grătar<\u002Fspan><span style=\"color: {{accent}}\">✦<\u002Fspan>\n<span>Zonă de relax<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ABOUT -->\n<section style=\"max-width: 1240px; margin: 0 auto; padding: clamp(72px, 10vw, 128px) clamp(16px, 4vw, 40px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: clamp(32px, 6vw, 96px); align-items: start\">\n<div>\n<div style=\"font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #8FA67A; margin-bottom: 20px\">Despre noi<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 300; font-size: clamp(36px, 4.4vw, 60px); line-height: 1.08; letter-spacing: -.015em\">Tradiția băii,<br>făcută cum trebuie.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 22px; font-size: 18px; color: #CFC4B2\">\n<p style=\"margin: 0\">La SAUNA ECO nu încălzim cu rezistențe electrice, ci cu foc viu. Soba pe lemne dă acel abur moale și dens pe care îl recunoști din prima respirație — căldura care relaxează mușchii, deschide porii și limpezește mintea.<\u002Fp>\n<p style=\"margin: 0\">Spațiul este închis și privat: vii cu familia sau cu prietenii, iar locul e doar al vostru. După abur — apă rece, ceai, terasă și, dacă vreți, un grătar în aer liber.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 8px\">\n<div style=\"display: flex; align-items: center; gap: 10px; font-size: 15px; color: #EFE6D8\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8FA67A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Spațiu privat<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px; font-size: 15px; color: #EFE6D8\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8FA67A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Wi‑Fi gratuit<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px; font-size: 15px; color: #EFE6D8\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8FA67A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Parcare păzită<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SERVICES (light) -->\n<section id=\"servicii\" style=\"background: #F2EBDF; color: #1B1712\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(72px, 10vw, 128px) clamp(16px, 4vw, 40px); display: flex; flex-direction: column; gap: 56px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 24px\">\n<div>\n<div style=\"font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #4F6B3E; margin-bottom: 18px\">Servicii &amp; facilități<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 300; font-size: clamp(36px, 4.4vw, 60px); line-height: 1.08; letter-spacing: -.015em\">Tot ce ai nevoie<br>pentru o seară bună.<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 0; max-width: 380px; color: #5A5045; font-size: 17px\">De la abur fierbinte la apă rece ca gheața — fiecare zonă e gândită pentru odihnă reală.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px\">\n\n<article style=\"background: #FBF7F0; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #E4D9C6\">\n<div style=\"width: 56px; height: 56px; border-radius: 16px; background: #1B1712; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F29A62\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22c4 0 7-3 7-7 0-5 045\">Contrastul care face toată diferența: tonifică, revigorează și întărește imunitatea.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FBF7F0; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #E4D9C6\">\n<div style=\"width: 56px; height: 56px; border-radius: 16px; background: #1B1712; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8FA67A\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22V10\"><\u002Fpath><path d=\"M12 15c-5 0-8-3-8-9 6 0 8 3 8 9z\"><\u002Fpath><path d=\"M12 12c4 0 7-2 7-7-5 0-7 2-7 7z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px\">Banșcik &amp; venik de mesteacăn<\u002Fh3>\n<p style=\"margin: 0; color: #5A5045\">Deservire profesională și veniki din mesteacăn de calitate superioară, pentru ritualul complet.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FBF7F0; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #E4D9C6\">\n<div style=\"width: 56px; height: 56px; border-radius: 16px; background: #1B1712; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F29A62\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 11h16a8 8 0 0 1-16 0z\"><\u002Fpath><path d=\"M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3M16 3c0 1.5 1 1.5 1 3M7 19l-2 3M17 19l2 3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px\">Terasă &amp; zonă de grătar<\u002Fh3>\n<p style=\"margin: 0; color: #5A5045\">Aer liber după abur: terasă amenajată și zonă de barbecue pentru seri lungi cu prietenii.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FBF7F0; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #E4D9C6\">\n<div style=\"width: 56px; height: 56px; border-radius: 16px; background: #1B1712; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#EFE6D8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 18v-6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v6\"><\u002Fpath><path d=\"M3 18h18M5 18v2M19 18v2M7 9V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px\">Zonă de relaxare<\u002Fh3>\n<p style=\"margin: 0; color: #5A5045\">Sală de odihnă confortabilă pentru pauzele dintre intrări — ceai, liniște, Wi‑Fi.<\u002Fp>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- RITUAL -->\n<section id=\"ritual\" style=\"max-width: 1240px; margin: 0 auto; padding: clamp(72px, 10vw, 128px) clamp(16px, 4vw, 40px); display: flex; flex-direction: column; gap: 56px\">\n<div style=\"max-width: 720px\">\n<div style=\"font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #8FA67A; margin-bottom: 18px\">Ritualul ECO<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 300; font-size: clamp(36px, 4.4vw, 60px); line-height: 1.08; letter-spacing: -.015em\">Patru pași spre<br><em style=\"color: #F29A62\">corpul ușor.<\u002Fem><\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 2px; background: rgba(239,230,216,.1); border-radius: 24px; overflow: hidden\">\n<div style=\"background: #12100D; padding: 36px 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Fraunces', serif; font-size: 56px; font-weight: 300; color: {{accent}}; line-height: 1\">01<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">Încălzirea<\u002Fh3>\n<p style=\"margin: 0; color: #B5A893; font-size: 16px\">Prima intrare, scurtă și blândă. Corpul se obișnuiește cu căldura, respirația se liniștește.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #12100D; padding: 36px 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Fraunces', serif; font-size: 56px; font-weight: 300; color: {{accent}}; line-height: 1\">02<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">Aburul cu venik<\u002Fh3>\n<p style=\"margin: 0; color: #B5A893; font-size: 16px\">Banșcikul lucrează cu venikul de mesteacăn: masaj, circulație, relaxare profundă.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #12100D; padding: 36px 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Fraunces', serif; font-size: 56px; font-weight: 300; color: #9EC3D6; line-height: 1\">03<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">Apa rece<\u002Fh3>\n<p style=\"margin: 0; color: #B5A893; font-size: 16px\">Scufundare scurtă în cuvă. Contrastul tonifică vasele și trezește tot corpul.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #12100D; padding: 36px 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Fraunces', serif; font-size: 56px; font-weight: 300; color: #8FA67A; line-height: 1\">04<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">Odihna<\u002Fh3>\n<p style=\"margin: 0; color: #B5A893; font-size: 16px\">Ceai din plante, terasă, conversație. Apoi repeți ciclul de câte ori simți.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PACKAGES -->\n<section id=\"pachete\" style=\"background: #17140F; border-top: 1px solid rgba(239,230,216,.08)\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(72px, 10vw, 128px) clamp(16px, 4vw, 40px); display: flex; flex-direction: column; gap: 56px\">\n<div style=\"text-a ction>\n\n\n<div style=\"border-top: 1px solid rgba(239,230,216,.1); border-bottom: 1px solid rgba(239,230,216,.1); background: #17140F\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 22px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px 32px; font-family: 'Fraunces', serif; font-style: italic; font-size: clamp(17px, 1.6vw, 21px); color: #CFC4B2\">\n<span>Baie rusească<\u002Fspan><span style=\"color: #E2733A\">✦<\u002Fspan>\n<span>Saună finlandeză<\u002Fspan><span style=\"color: #E2733A\">✦<\u002Fspan>\n<span>Apă rece<\u002Fspan><span style=\"color: #E2733A\">✦<\u002Fspan>\n<span>Terasă &amp; grătar<\u002Fspan><span style=\"color: #E2733A\">✦<\u002Fspan>\n<span>Zonă de relax<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<section style=\"max-width: 1240px; margin: 0 auto; padding: clamp(72px, 10vw, 128px) clamp(16px, 4vw, 40px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: clamp(32px, 6vw, 96px); align-items: start\">\n<div>\n<div style=\"font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #8FA67A; margin-bottom: 20px\">Despre noi<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 300; font-size: clamp(36px, 4.4vw, 60px); line-height: 1.08; letter-spacing: -.015em\">Tradiția băii,<br>făcută cum trebuie.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 22px; font-size: 18px; color: #CFC4B2\">\n<p style=\"margin: 0\">La SAUNA ECO nu încălzim cu rezistențe electrice, ci cu foc viu. Soba pe lemne dă acel abur moale și dens pe care îl recunoști din prima respirație — căldura care relaxează mușchii, deschide porii și limpezește mintea.<\u002Fp>\n<p style=\"margin: 0\">Spațiul este închis și privat: vii cu familia sau cu prietenii, iar locul e doar al vostru. După abur — apă rece, ceai, terasă și, dacă vreți, un grătar în aer liber.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 8px\">\n<div style=\"display: flex; align-items: center; gap: 10px; font-size: 15px; color: #EFE6D8\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8FA67A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Spațiu privat<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px; font-size: 15px; color: #EFE6D8\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8FA67A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Wi‑Fi gratuit<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px; font-size: 15px; color: #EFE6D8\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8FA67A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Parcare păzită<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"servicii\" style=\"background: #F2EBDF; color: #1B1712\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(72px, 10vw, 128px) clamp(16px, 4vw, 40px); display: flex; flex-direction: column; gap: 56px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 24px\">\n<div>\n<div style=\"font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #4F6B3E; margin-bottom: 18px\">Servicii &amp; facilități<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 300; font-size: clamp(36px, 4.4vw, 60px); line-height: 1.08; letter-spacing: -.015em\">Tot ce ai nevoie<br>pentru o seară bună.<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 0; max-width: 380px; color: #5A5045; font-size: 17px\">De la abur fierbinte la apă rece ca gheața — fiecare zonă e gândită pentru odihnă reală.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px\">\n\n<article style=\"background: #FBF7F0; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #E4D9C6\">\n<div style=\"width: 56px; height: 56px; border-radius: 16px; background: #1B1712; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F29A62\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22c4 0 7-3 7-7 0-5-4-7-5-12-2 2-3 4-3 6-1-1-2-2-2-4-2 2-4 5-4 10 0 4 3 7 7 7z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px\">Baie de aburi pe lemne<\u002Fh3>\n<p style=\"margin: 0; color: #5A5045\">Bania rusească clasică, cu sobă pe lemne și abur umed, moale. Inima locului.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FBF7F0; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #E4D9C6\">\n<div style=\"width: 56px; height: 56px; border-radius: 16px; background: #1B1712; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F29A62\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px\">Saună finlandeză<\u002Fh3>\n<p style=\"margin: 0; color: #5A5045\">Căldură uscată, intensă, pentru cei care preferă temperaturi înalte și aer curat.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FBF7F0; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #E4D9C6\">\n<div style=\"width: 56px; height: 56px; border-radius: 16px; background: #1B1712; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9EC3D6\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2.7 6.3 9a7 7 0 1 0 11.4 0z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px\">Cuvă cu apă rece<\u002Fh3>\n<p style=\"margin: 0; color: #5A5045\">Contrastul care face toată diferența: tonifică, revigorează și întărește imunitatea.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FBF7F0; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #E4D9C6\">\n<div style=\"width: 56px; height: 56px; border-radius: 16px; background: #1B1712; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8FA67A\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22V10\"><\u002Fpath><path d=\"M12 15c-5 0-8-3-8-9 6 0 8 3 8 9z\"><\u002Fpath><path d=\"M12 12c4 0 7-2 7-7-5 0-7 2-7 7z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px\">Banșcik &amp; venik de mesteacăn<\u002Fh3>\n<p style=\"margin: 0; color: #5A5045\">Deservire profesională și veniki din mesteacăn de calitate superioară, pentru ritualul complet.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FBF7F0; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #E4D9C6\">\n<div style=\"width: 56px; height: 56px; border-radius: 16px; background: #1B1712; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F29A62\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 11h16a8 8 0 0 1-16 0z\"><\u002Fpath><path d=\"M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3M16 3c0 1.5 1 1.5 1 3M7 19l-2 3M17 19l2 3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px\">Terasă &amp; zonă de grătar<\u002Fh3>\n<p style=\"margin: 0; color: #5A5045\">Aer liber după abur: terasă amenajată și zonă de barbecue pentru seri lungi cu prietenii.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FBF7F0; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #E4D9C6\">\n<div style=\"width: 56px; height: 56px; border-radius: 16px; background: #1B1712; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#EFE6D8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 18v-6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v6\"><\u002Fpath><path d=\"M3 18h18M5 18v2M19 18v2M7 9V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px\">Zonă de relaxare<\u002Fh3>\n<p style=\"margin: 0; color: #5A5045\">Sală de odihnă confortabilă pentru pauzele dintre intrări — ceai, liniște, Wi‑Fi.<\u002Fp>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"ritual\" style=\"max-width: 1240px; margin: 0 auto; padding: clamp(72px, 10vw, 128px) clamp(16px, 4vw, 40px); display: flex; flex-direction: column; gap: 56px\">\n<div style=\"max-width: 720px\">\n<div style=\"font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #8FA67A; margin-bottom: 18px\">Ritualul ECO<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 300; font-size: clamp(36px, 4.4vw, 60px); line-height: 1.08; letter-spacing: -.015em\">Patru pași spre<br><em style=\"color: #F29A62\">corpul ușor.<\u002Fem><\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 2px; background: rgba(239,230,216,.1); border-radius: 24px; overflow: hidden\">\n<div style=\"background: #12100D; padding: 36px 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Fraunces', serif; font-size: 56px; font-weight: 300; color: #E2733A; line-height: 1\">01<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">Încălzirea<\u002Fh3>\n<p style=\"margin: 0; color: #B5A893; font-size: 16px\">Prima intrare, scurtă și blândă. Corpul se obișnuiește cu căldura, respirația se liniștește.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #12100D; padding: 36px 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Fraunces', serif; font-size: 56px; font-weight: 300; color: #E2733A; line-height: 1\">02<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">Aburul cu venik<\u002Fh3>\n<p style=\"margin: 0; color: #B5A893; font-size: 16px\">Banșcikul lucrează cu venikul de mesteacăn: masaj, circulație, relaxare profundă.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #12100D; padding: 36px 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Fraunces', serif; font-size: 56px; font-weight: 300; color: #9EC3D6; line-height: 1\">03<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">Apa rece<\u002Fh3>\n<p style=\"margin: 0; color: #B5A893; font-size: 16px\">Scufundare scurtă în cuvă. Contrastul tonifică vasele și trezește tot corpul.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #12100D; padding: 36px 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Fraunces', serif; font-size: 56px; font-weight: 300; color: #8FA67A; line-height: 1\">04<\u002Fdiv>\n<h3 style=
